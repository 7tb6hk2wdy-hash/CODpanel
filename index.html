<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Duty - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 900px;
        }

        .panel {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1419 100%);
            border: 3px solid #ffd700;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            animation: scanline 2s infinite;
        }

        @keyframes scanline {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1em;
            color: #fff;
            letter-spacing: 2px;
        }

        .status-display {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.95em;
            color: #00ff00;
        }

        .status-label {
            color: #00ff00;
            font-weight: bold;
        }

        .status-value {
            color: #00ff00;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.7; }
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 15px 20px;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .control-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #cc9900 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .activate-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border: 3px solid #ff0000;
            color: #fff;
            padding: 20px;
            font-size: 1.3em;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .activate-btn:hover {
            background: linear-gradient(135deg, #ff6666 0%, #ff0000 100%);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .activate-btn:active {
            transform: scale(0.98);
        }

        .activate-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            animation: glow 0.5s ease;
            margin: 30px 0;
        }

        @keyframes glow {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .error-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .error-box {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border: 5px solid #ff0000;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.8), inset 0 0 40px rgba(255, 0, 0, 0.4);
            animation: shake 0.5s ease, pulse 0.5s ease infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 60px rgba(255, 0, 0, 0.8), inset 0 0 40px rgba(255, 0, 0, 0.4); }
            50% { box-shadow: 0 0 100px rgba(255, 0, 0, 1), inset 0 0 60px rgba(255, 0, 0, 0.6); }
        }

        .error-title {
            font-size: 4em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #000;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .error-message {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 0 0 15px #000;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .error-emoji {
            font-size: 3em;
            margin: 20px 0;
            animation: bounce 0.6s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .warning-icon {
            font-size: 5em;
            margin: 20px 0;
            animation: wobble 0.5s infinite;
            display: inline-block;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.95; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="container">
        <div class="panel">
            <div class="header">
                <h1>⚔️ WARZONE CONTROL</h1>
                <p>OPERATOR COMMAND CENTER</p>
            </div>

            <div class="status-display">
                <div class="status-line">
                    <span class="status-label">SYSTEM STATUS:</span>
                    <span class="status-value">● ONLINE</span>
                </div>
                <div class="status-line">
                    <span class="status-label">SECURITY LEVEL:</span>
                    <span class="status-value">MAXIMUM</span>
                </div>
                <div class="status-line">
                    <span class="status-label">FIREWALL:</span>
                    <span class="status-value">● ACTIVE</span>
                </div>
                <div class="status-line">
                    <span class="status-label">CONNECTION:</span>
                    <span class="status-value">STABLE</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn">🛡️ SHIELD</button>
                <button class="control-btn">⚡ POWER</button>
                <button class="control-btn">📡 SIGNAL</button>
                <button class="control-btn">🔒 LOCK</button>
            </div>

            <button class="activate-btn" id="activateBtn">▶ ACTIVATE PANEL</button>

            <div class="success-message" id="successMsg">
                ✓ PANEL CALL OF DUTY ACTIVATED ✓
            </div>
        </div>
    </div>

    <div class="error-container" id="errorContainer">
        <div class="error-box">
            <div class="warning-icon">⚠️</div>
            <div class="error-title">ERROR 404</div>
            <div class="error-message">YOU GOT HACKED 😂</div>
        </div>
    </div>

    <script>
        const activateBtn = document.getElementById('activateBtn');
        const successMsg = document.getElementById('successMsg');
        const errorContainer = document.getElementById('errorContainer');

        activateBtn.addEventListener('click', function() {
            activateBtn.classList.add('disabled');
            activateBtn.disabled = true;

            // Show success message
            successMsg.style.display = 'block';

            // Wait 3 seconds then show error
            setTimeout(() => {
                errorContainer.style.display = 'flex';
            }, 3000);
        });
    </script>
</body>
</html>
